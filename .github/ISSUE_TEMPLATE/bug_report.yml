name: Bug report
description: Something looks wrong or does not work
labels: [bug]
body:
  - type: input
    id: ide
    attributes:
      label: IDE and version
      description: From the About dialog, for example "IntelliJ IDEA 2026.2.3".
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Warden Navy Blacksteele
        - Warden Navy Nakki
        - Both
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what did you expect?
      description: A screenshot helps a lot. Please make sure it shows nothing private.
    validations:
      required: true
